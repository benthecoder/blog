name: Generate Blog Post Embeddings

permissions:
  contents: read

on:
  push:
    paths:
      - "posts/*.md"
    branches:
      - main # or your default branch
  workflow_dispatch:

jobs:
  generate-embeddings:
    runs-on: ubuntu-latest

    env:
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      VOYAGE_AI_API_KEY: ${{ secrets.VOYAGE_AI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history to get changed files

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v46.0.1
        with:
          files: "posts/*.md"
          separator: "\n"

      - name: Generate embeddings for changed files
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            if [[ ! "$file" =~ ^posts/([a-zA-Z0-9_-]+(\.[a-zA-Z0-9_-]+)*)\.md$ ]]; then
              echo "Skipping unsupported post filename"
              continue
            fi
            echo "Processing: $file"
            slug="${BASH_REMATCH[1]}"
            npx tsx scripts/generateEmbeddings.ts "$slug"
          done <<< "$CHANGED_FILES"

      - name: Trigger Vercel deployment to update knowledge map
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOKS }}
        run: |
          curl --fail --silent --show-error -X POST "$VERCEL_DEPLOY_HOOK"
