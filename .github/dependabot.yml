version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # A 0.x patch release redesigned every sound (0.2.1 -> 0.2.8). The
      # site's cues are chosen by ear, so upgrade only on purpose.
      - dependency-name: cuelume
    groups:
      production-patches:
        dependency-type: production
        update-types: [minor, patch]
      development-patches:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
